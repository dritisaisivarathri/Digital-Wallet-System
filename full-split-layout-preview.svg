<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061A1A"/>
      <stop offset="0.52" stop-color="#061631"/>
      <stop offset="1" stop-color="#0A3A2E"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5B46" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0B2435" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="800" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#083A2E" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#0A1E39" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="900" fill="url(#leftPanel)"/>
  <rect x="800" y="0" width="800" height="900" fill="url(#rightPanel)"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#2ED8A3" stroke-opacity="0.32"/>

  <rect x="80" y="70" width="180" height="38" rx="19" fill="#1B6C58" stroke="#49D5A0" stroke-opacity="0.35"/>
  <text x="170" y="95" fill="#D9FFF0" font-family="Segoe UI, Arial" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">DIGITAL WALLET</text>

  <text x="80" y="185" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="70" font-weight="700">Your money,</text>
  <text x="80" y="265" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="70" font-weight="700">rewards, and</text>
  <text x="80" y="345" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="70" font-weight="700">account checks</text>
  <text x="80" y="425" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="70" font-weight="700">in one place.</text>

  <text x="80" y="490" fill="#C3EDE0" font-family="Segoe UI, Arial" font-size="24">Digital wallet ready to spend, transfer, and track instantly.</text>

  <rect x="80" y="560" width="640" height="250" rx="28" fill="#113D35" fill-opacity="0.70" stroke="#42D1A0" stroke-opacity="0.35"/>
  <text x="110" y="610" fill="#C7F9E9" font-family="Segoe UI, Arial" font-size="20" font-weight="600" letter-spacing="1.2">EVERYDAY BALANCE</text>
  <text x="110" y="665" fill="#E8FFF6" font-family="Segoe UI, Arial" font-size="56" font-weight="700">Ready to spend</text>

  <rect x="980" y="110" width="540" height="62" rx="31" fill="#165440" stroke="#3DCE9B" stroke-opacity="0.4"/>
  <rect x="987" y="117" width="265" height="48" rx="24" fill="url(#button)"/>
  <text x="1120" y="148" fill="#072015" font-family="Segoe UI, Arial" font-size="24" font-weight="700" text-anchor="middle">Sign In</text>
  <text x="1328" y="148" fill="#C6F3E6" font-family="Segoe UI, Arial" font-size="24" font-weight="700" text-anchor="middle">Create Account</text>

  <text x="980" y="250" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="72" font-weight="700">Access your</text>
  <text x="980" y="330" fill="#EAFEF7" font-family="Segoe UI, Arial" font-size="72" font-weight="700">workspace</text>

  <text x="980" y="385" fill="#B8E7DA" font-family="Segoe UI, Arial" font-size="24">Sign in to manage wallet, rewards, and KYC details.</text>

  <text x="980" y="455" fill="#D5FAEE" font-family="Segoe UI, Arial" font-size="20" font-weight="700" letter-spacing="1.2">USERNAME OR EMAIL</text>
  <rect x="980" y="470" width="540" height="70" rx="18" fill="#1A2D43" stroke="#315D78"/>
  <text x="1000" y="515" fill="#7394A8" font-family="Segoe UI, Arial" font-size="26">Enter username or email</text>

  <text x="980" y="595" fill="#D5FAEE" font-family="Segoe UI, Arial" font-size="20" font-weight="700" letter-spacing="1.2">PASSWORD</text>
  <rect x="980" y="610" width="540" height="70" rx="18" fill="#1A2D43" stroke="#315D78"/>
  <text x="1000" y="655" fill="#7394A8" font-family="Segoe UI, Arial" font-size="26">Enter your password</text>

  <rect x="980" y="725" width="540" height="76" rx="38" fill="url(#button)"/>
  <text x="1250" y="773" fill="#062314" font-family="Segoe UI, Arial" font-size="31" font-weight="800" text-anchor="middle">Sign In</text>
</svg>

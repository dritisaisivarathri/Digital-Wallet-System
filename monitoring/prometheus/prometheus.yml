global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: docker-wallet-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761
          - config-server:8888
          - api-gateway:8090
          - auth-service:8081
          - user-service:8082
          - wallet-service:8083
          - transaction-service:8084
          - rewards-service:8085
          - notification-service:8086
          - admin-service:8087

  - job_name: host-wallet-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761
          - host.docker.internal:8888
          - host.docker.internal:8090
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084
          - host.docker.internal:8085
          - host.docker.internal:8086
          - host.docker.internal:8087

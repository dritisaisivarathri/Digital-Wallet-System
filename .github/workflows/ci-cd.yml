name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Backend (Maven)
      # We skip tests by default to prevent CI failures from missing database connections.
      # You can remove -DskipTests if your tests are fully mocked or you add service containers.
      run: mvn -B clean package -DskipTests

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Build Frontend (Node.js)
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker Compose Build
      # This ensures all your Dockerfiles are valid and can package the built apps.
      run: docker compose build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    # Only run deployment when code is pushed to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 1. Navigate to the directory where your project lives on the server
          # Replace /opt/Digital-Wallet-System with your actual project path
          cd /opt/Digital-Wallet-System
          
          # 2. Pull the latest code
          git pull origin main
          
          # 3. Rebuild and restart the containers in the background
          docker compose up -d --build

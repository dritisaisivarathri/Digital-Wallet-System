server.port=8083
spring.application.name=wallet-service
springdoc.api-docs.path=/v3/api-docs
springdoc.server-url=${SPRINGDOC_SERVER_URL:http://localhost:8090}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/digital_wallet_wallet}
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Wallet Management Service
info.app.version=1.0.0
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# Prometheus Metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

services.transaction-service.internal-base-url=${TRANSACTION_SERVICE_INTERNAL_BASE_URL:http://localhost:8084}
services.rewards-service.internal-base-url=${REWARDS_SERVICE_INTERNAL_BASE_URL:http://localhost:8085}
services.user-service.internal-base-url=${USER_SERVICE_INTERNAL_BASE_URL:http://localhost:8082}
services.auth-service.internal-base-url=${AUTH_SERVICE_INTERNAL_BASE_URL:http://localhost:8081}
services.notification-service.internal-base-url=${NOTIFICATION_SERVICE_INTERNAL_BASE_URL:http://localhost:8086}
